apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ilosia
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/quaxsze/ilosia.git
    targetRevision: main
    path: charts/ilosia
    helm:
      valueFiles:
        - ../../gitops/dev/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ilosia
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true


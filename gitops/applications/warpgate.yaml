apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: warpgate
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: ghcr.io/warp-tech/helm-charts
      chart: warpgate
      targetRevision: 0.2.0
      helm:
        releaseName: warpgate
        valueFiles:
          - $values/gitops/dev/warpgate-values.yaml
    - repoURL: https://github.com/quaxsze/ilosia.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: warpgate
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

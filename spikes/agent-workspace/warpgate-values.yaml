image:
  tag: "0.30.2"

setup:
  enabled: true
  envFromSecret:
    WARPGATE_ADMIN_PASSWORD: warpgate-aw0/adminPassword
  ssh: 2222
  http: 8888
  mysql: 0
  pgsql: 0
  kubernetes: 0

data:
  pvc:
    enabled: true
    template:
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 1Gi

podSecurityContext:
  fsGroup: 1000

service:
  type: LoadBalancer
  ports:
    ssh: 2222
    http: 8888
    mysql: 0
    pgsql: 0

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

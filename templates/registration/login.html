{% extends "base.html" %}

{% block title %}Login · Ilosia{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h1 class="h3 mb-4">Login</h1>
          {% if oidc_enabled %}
            <a class="btn btn-primary w-100 mb-4" href="{% url 'oidc_authentication_init' %}">
              Login with Keycloak
            </a>
            <div class="text-center text-body-secondary mb-4">or use a local account</div>
          {% endif %}
          {% if form.errors %}
            <div class="alert alert-danger" role="alert">
              Invalid username or password.
            </div>
          {% endif %}
          <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            <div class="mb-3">
              <label class="form-label" for="{{ form.username.id_for_label }}">Username</label>
              <input
                class="form-control"
                id="{{ form.username.id_for_label }}"
                name="{{ form.username.html_name }}"
                type="text"
                autocomplete="username"
                autofocus
                required>
            </div>
            <div class="mb-4">
              <label class="form-label" for="{{ form.password.id_for_label }}">Password</label>
              <input
                class="form-control"
                id="{{ form.password.id_for_label }}"
                name="{{ form.password.html_name }}"
                type="password"
                autocomplete="current-password"
                required>
            </div>
            <button class="btn btn-primary w-100" type="submit">Login</button>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}

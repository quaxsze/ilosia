<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Ilosia{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js" defer></script>
  </head>
  <body class="bg-body-tertiary">
    <nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark">
      <div class="container">
        <a class="navbar-brand" href="{% url 'catalog:list' %}">Ilosia</a>
        {% if user.is_authenticated %}
          <div class="navbar-nav flex-row gap-3 align-items-center">
            <a class="nav-link" href="{% url 'catalog:list' %}">Catalog</a>
            <a class="nav-link" href="{% url 'workloads:list' %}">My Services</a>
            <a class="nav-link" href="{% url 'storage:list' %}">Storage</a>
            <span class="navbar-text">{{ user.username }}</span>
            <form method="post" action="{% if oidc_enabled %}{% url 'oidc_logout' %}{% else %}{% url 'logout' %}{% endif %}">
              {% csrf_token %}
              <button class="btn btn-sm btn-outline-light" type="submit">Logout</button>
            </form>
          </div>
        {% endif %}
      </div>
    </nav>

    <main class="container py-5">
      {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'info' }}" role="alert">
          {{ message }}
        </div>
      {% endfor %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>

apiVersion: v1
kind: Secret
metadata:
  name: ilosia-secrets
  namespace: ilosia
type: Opaque
stringData:
  DJANGO_SECRET_KEY: replace-with-a-long-random-value
  POSTGRES_PASSWORD: replace-with-a-random-password
  S3_ACCESS_KEY: GKreplace-with-32-hex-characters
  S3_SECRET_KEY: replace-with-64-hex-characters
  GARAGE_RPC_SECRET: replace-with-64-hex-characters
  GARAGE_ADMIN_TOKEN: replace-with-a-random-token
  GARAGE_METRICS_TOKEN: replace-with-a-random-token
  OIDC_RP_CLIENT_SECRET: replace-with-a-random-client-secret
  KEYCLOAK_ADMIN_USERNAME: admin
  KEYCLOAK_ADMIN_PASSWORD: replace-with-a-random-admin-password
  KEYCLOAK_POSTGRES_PASSWORD: replace-with-a-random-database-password

apiVersion: batch/v1
kind: Job
metadata:
  name: ilosia-migrate
  namespace: ilosia
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ilosia
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ilosia:dev
          imagePullPolicy: Never
          command:
            - python
            - manage.py
            - migrate
            - --noinput
          envFrom:
            - configMapRef:
                name: ilosia-config
            - secretRef:
                name: ilosia-secrets
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

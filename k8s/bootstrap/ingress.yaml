apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ilosia
  namespace: ilosia
spec:
  ingressClassName: nginx
  rules:
    - host: ilosia.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ilosia-web
                port:
                  name: http

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ilosia-web
  namespace: ilosia
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ilosia
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ilosia
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: ilosia:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: ilosia-config
            - secretRef:
                name: ilosia-secrets
          readinessProbe:
            httpGet:
              path: /healthz/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ilosia-web
  namespace: ilosia
spec:
  selector:
    app.kubernetes.io/name: ilosia
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.database.persistence.claimName }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "ilosia.commonLabels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.database.persistence.size }}

{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  annotations:
    nginx.org/proxy-read-timeout: 360s
    {{- with .Values.ingress.publicHost }}
    nginx.org/proxy-set-headers: {{ printf "X-Ilosia-Host: %s" . | quote }}
    {{- end }}
  labels:
    {{- include "ilosia.commonLabels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-web
                port:
                  name: http
{{- end }}

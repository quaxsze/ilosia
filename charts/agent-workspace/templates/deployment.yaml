{{- $repositoryUrl := required "repository.url is required" .Values.repository.url -}}
{{- $authorizedKeys := required "warpgate.publicKeys must contain at least one key" (join "\n" .Values.warpgate.publicKeys) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "agent-workspace.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "agent-workspace.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agent-workspace.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: clone
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/usr/local/bin/clone-repository]
          env:
            - name: REPOSITORY_URL
              value: {{ $repositoryUrl | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.cloneResources | nindent 12 }}
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
      containers:
        - name: workspace
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: AUTHORIZED_KEYS
              value: {{ $authorizedKeys | quote }}
            - name: GIT_USER_NAME
              value: {{ .Values.git.userName | quote }}
            - name: GIT_USER_EMAIL
              value: {{ .Values.git.userEmail | quote }}
          ports:
            - name: ssh
              containerPort: 2222
          readinessProbe:
            tcpSocket:
              port: ssh
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: ssh
            initialDelaySeconds: 15
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /run
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.temporaryStorage.tmp }}
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.temporaryStorage.run }}

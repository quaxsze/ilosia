apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "agent-workspace.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agent-workspace.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.warpgate.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.warpgate.podLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: 2222
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dns.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dns.podLabels | nindent 14 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- toYaml .Values.networkPolicy.blockedCidrsV4 | nindent 14 }}
      ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: ::/0
            except:
              {{- toYaml .Values.networkPolicy.blockedCidrsV6 | nindent 14 }}
      ports:
        - protocol: TCP
          port: 443
